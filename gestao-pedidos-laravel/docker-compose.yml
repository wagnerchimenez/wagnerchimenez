services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
      APP_NAME: "Gestao Pedidos"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:wbFGyDZQtdN9rSgL6o8Bhig4nfu083XL3/pchMJs8I8=
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gestao_pedidos
      DB_USERNAME: gestao
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache &&
             chmod -R ug+rwx storage bootstrap/cache &&
             php artisan config:clear &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Gestao Pedidos"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:wbFGyDZQtdN9rSgL6o8Bhig4nfu083XL3/pchMJs8I8=
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gestao_pedidos
      DB_USERNAME: gestao
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    command: >
      sh -c "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache &&
             php artisan queue:work redis --queue=pedidos,relatorios,default --sleep=1 --tries=3 --timeout=120"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao_pedidos
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: secret
    # Evita conflito com Postgres local: use 5433 no host
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_pedidos"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Evita conflito com Redis local: use 6380 no host
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
