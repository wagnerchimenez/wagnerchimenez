services:
  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:wbFGyDZQtdN9rSgL6o8Bhig4nfu083XL3/pchMJs8I8=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gestao_pedidos
      DB_USERNAME: gestao
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./storage:/var/www/html/storage

  worker:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:wbFGyDZQtdN9rSgL6o8Bhig4nfu083XL3/pchMJs8I8=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gestao_pedidos
      DB_USERNAME: gestao
      DB_PASSWORD: secret
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - redis
      - postgres
    command: php artisan queue:work redis --queue=pedidos,relatorios,default --sleep=1 --tries=3
    volumes:
      - ./storage:/var/www/html/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao_pedidos
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
